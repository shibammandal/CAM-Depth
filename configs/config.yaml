# CAM-Depth Configuration

simulation:
  gui: true  # Enable PyBullet GUI
  timestep: 0.01  # Physics timestep
  gravity: -9.81
  world_size: [20.0, 20.0]  # meters

robot:
  type: "differential_drive"
  wheel_radius: 0.05
  wheel_base: 0.3
  max_speed: 1.0  # m/s
  camera_height: 0.3
  camera_baseline: 0.1  # Distance between stereo cameras (meters)

sensors:
  lidar:
    enabled: true
    num_rays: 360
    max_range: 10.0
    fov: 360  # degrees
  
  cameras:
    enabled: true
    width: 320
    height: 240
    fov: 60  # degrees
    near: 0.1
    far: 10.0

depth_estimation:
  # Initial stereo matching parameters (RL will optimize these)
  block_size: 5  # Must be odd, range: 3-21
  min_disparity: 0
  num_disparities: 64  # Must be divisible by 16
  uniqueness_ratio: 10  # range: 0-20
  speckle_window_size: 100
  speckle_range: 2

navigation:
  goal_threshold: 0.5  # meters
  collision_threshold: 0.3
  max_episode_steps: 1000

training:
  algorithm: "PPO"
  total_timesteps: 100000
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  checkpoint_freq: 10000
  
  # Reward weights
  rewards:
    depth_error_weight: -1.0
    smoothness_weight: 0.1
    navigation_progress_weight: 0.5
    collision_penalty: -100.0
    goal_bonus: 500.0

visualization:
  update_freq: 10  # Update display every N steps
  save_video: false
  plot_metrics: true
